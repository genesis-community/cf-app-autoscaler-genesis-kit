---
kit:
  name: dev
  version: latest
  features:
    - external-db

genesis:
  env: external-db

params:
  cf_deployment_env: base-test

bosh-variables:
  database:
    host:     external.mysql.mycorp.com
    port:     3306
    scheme:   mysql
    name:     autoscaler
    username: autoscaler
    password: external-db-password
    sslmode:  verify_identity
    tls.ca:   <!database.tls.ca!>
