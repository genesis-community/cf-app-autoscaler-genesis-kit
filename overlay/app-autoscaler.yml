addons:
- jobs:
  - name: bosh-dns-aliases
    properties:
      aliases:
      - domain: ((postgres_domain))
        targets:
        - deployment: ((deployment_name))
          domain: bosh
          instance_group: postgres
          network: default
          query: '*'
      - domain: ((api_domain))
        targets:
        - deployment: ((deployment_name))
          domain: bosh
          instance_group: apiserver
          network: default
          query: '*'
      - domain: ((scheduler_domain))
        targets:
        - deployment: ((deployment_name))
          domain: bosh
          instance_group: scheduler
          network: default
          query: '*'
      - domain: ((servicebroker_domain))
        targets:
        - deployment: ((deployment_name))
          domain: bosh
          instance_group: apiserver
          network: default
          query: '*'
      - domain: ((eventgenerator_domain))
        targets:
        - deployment: ((deployment_name))
          domain: bosh
          instance_group: eventgenerator
          network: default
          query: '*'
      - domain: ((scalingengine_domain))
        targets:
        - deployment: ((deployment_name))
          domain: bosh
          instance_group: scalingengine
          network: default
          query: '*'
      - domain: nats.service.cf.internal
        targets:
        - deployment: (( grab meta.cf.deployment_name ))
          domain: bosh
          instance_group: nats
          network: default
          query: '*'
      - domain: reverse-log-proxy.service.cf.internal
        targets:
        - deployment: (( grab meta.cf.deployment_name ))
          domain: bosh
          instance_group: log-api
          network: default
          query: '*'
      - domain: _.nats.service.cf.internal
        targets:
        - deployment: (( grab meta.cf.deployment_name ))
          domain: bosh
          instance_group: nats
          network: default
          query: _
      - domain: logcache
        targets:
        - deployment: (( grab meta.cf.deployment_name ))
          domain: bosh
          instance_group: log-cache
          network: default
          query: '*'
      - domain: log-cache.service.cf.internal
        targets:
        - deployment: (( grab meta.cf.deployment_name ))
          domain: bosh
          instance_group: log-cache
          network: default
          query: '*'
    release: bosh-dns-aliases
  name: bosh-dns-aliases
- jobs:
  - name: bpm
    release: bpm
  name: bpm
bosh-variables:
  api_domain: (( concat params.domain_prefix "apiserver.service.cf.internal" ))
  base_public_domain: (( concat meta.public_subdomain ".((system_domain))" ))
  eventgenerator_domain: (( concat params.domain_prefix "eventgenerator.service.cf.internal" ))
  metricsforwarder_mtls_public_domain: (( concat params.domain_prefix "-metricsforwarder-mtls.((system_domain))" ))
  metricsforwarder_public_domain: (( concat params.domain_prefix "metrics.((system_domain))" ))
  postgres_domain: (( concat params.domain_prefix "autoscalerpostgres.service.cf.internal" ))
  scalingengine_domain: (( concat params.domain_prefix "scalingengine.service.cf.internal" ))
  scheduler_domain: (( concat params.domain_prefix "autoscalerscheduler.service.cf.internal" ))
  servicebroker_domain: (( concat params.domain_prefix "servicebroker.service.cf.internal" ))
  servicebroker_public_domain: (( concat params.domain_prefix "servicebroker.((system_domain))" ))
features:
  use_dns_addresses: true
instance_groups:
- azs:
  - z1
  instances: 1
  jobs:
  - name: postgres
    properties:
      databases:
        address: ((postgres_domain))
        connection_config:
          connection_max_lifetime: 60s
          max_idle_connections: 10
          max_open_connections: 100
        databases:
        - name: autoscaler
          tag: default
        db_scheme: postgres
        port: 5432
        roles:
        - name: postgres
          password: ((database_password))
          tag: default
        sslmode: verify-full
        tls:
          ca: ((postgres_ca.ca))
          certificate: ((postgres_server.certificate))
          private_key: ((postgres_server.private_key))
    release: postgres
  name: postgres
  networks:
  - name: default
  stemcell: default
  update:
    serial: true
  vm_type: small
- azs:
  - z1
  instances: 1
  jobs:
  - name: scalingengine
