---
instance_groups:
- name: eventgenerator
  jobs:
  - name: eventgenerator
    properties:
      autoscaler:
        eventgenerator:
          metricscollector:
            use_log_cache: true
            host:          ((logcache_domain))
            port:          8080
            server_name:   log_cache
            ca_cert:       (( concat "((" meta.cf.credhub_path "log_cache.ca))" ))
            client_cert:   (( concat "((" meta.cf.credhub_path "log_cache.certificate))" ))
            client_key:    (( concat "((" meta.cf.credhub_path "log_cache.private_key))" ))
