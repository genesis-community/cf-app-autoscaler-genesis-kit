---
addons:
- name: bosh-dns-aliases
  jobs:
  - name: bosh-dns-aliases
    properties:
      aliases:
      - (( merge on domain ))
      - domain: ((postgres_domain))
        targets:
        - (( merge on query ))
        - query: '*'
          network: (( grab params.network ))
      - domain: ((api_domain))
        targets:
        - (( merge on query ))
        - query: '*'
          network: (( grab params.network ))
      - domain: ((scheduler_domain))
        targets:
        - (( merge on query ))
        - query: '*'
          network: (( grab params.network ))
      - domain: ((servicebroker_domain))
        targets:
        - (( merge on query ))
        - query: '*'
          network: (( grab params.network ))
      - domain: ((eventgenerator_domain))
        targets:
        - (( merge on query ))
        - query: '*'
          network: (( grab params.network ))
      - domain: ((scalingengine_domain))
        targets:
        - (( merge on query ))
        - query: '*'
          network: (( grab params.network ))
      - domain: nats.service.cf.internal
        targets:
        - (( merge on query ))
        - query: '*'
          deployment: (( grab meta.cf.deployment_name ))
          network: (( grab params.cf_core_network ))
      - domain: reverse-log-proxy.service.cf.internal
        targets:
        - (( merge on query ))
        - query: '*'
          deployment: (( grab meta.cf.deployment_name ))
          network: (( grab params.cf_core_network ))
      - domain: _.nats.service.cf.internal
        targets:
        - (( merge on query ))
        - query: '_'
          deployment: (( grab meta.cf.deployment_name ))
          network: (( grab params.cf_core_network ))
      - domain: logcache
        targets:
        - (( merge on query ))
        - query: '*'
          deployment: (( grab meta.cf.deployment_name ))
          network: (( grab params.cf_core_network ))
      - domain: log-cache.service.cf.internal
        targets:
        - (( merge on query ))
        - query: '*'
          deployment: (( grab meta.cf.deployment_name ))
          network: (( grab params.cf_core_network ))

instance_groups:
- name: postgres
  azs: (( grab meta.azs ))
  networks:
  - (( replace ))
  - name: (( grab params.network ))

- name: scalingengine
  azs: (( grab meta.azs ))
  networks:
  - (( replace ))
  - name: (( grab params.network ))

- name: apiserver
  azs: (( grab meta.azs ))
  networks:
  - (( replace ))
  - name: (( grab params.network ))
  jobs:
  - name: golangapiserver
    release: app-autoscaler
    properties:
      autoscaler:
        apiserver:
          broker:
            broker_credentials:
            - (( replace ))
            - broker_username: ((autoscaler_service_broker_username))
              broker_password: ((autoscaler_service_broker_password))


- name: scheduler
  azs: (( grab meta.azs ))
  networks:
  - (( replace ))
  - name: (( grab params.network ))

- name: operator
  azs: (( grab meta.azs ))
  networks:
  - (( replace ))
  - name: (( grab params.network ))

- name: eventgenerator
  azs: (( grab meta.azs ))
  networks:
  - (( replace ))
  - name: (( grab params.network ))
  jobs:
  - name: eventgenerator
    properties:
      autoscaler:
        eventgenerator:
          metricscollector:
            ca_cert: ((metricscollector_ca_cert.ca))
            client_cert: ((metricscollector_client.certificate))
            client_key: ((metricscollector_client.private_key))

- name: metricsforwarder
  networks:
  - (( replace ))
  - name: (( grab params.network ))
  jobs:
  - name: route_registrar
    properties:
      route_registrar:
        routes:
        - name: autoscaler_metrics_forwarder_mtls
          registration_interval: 20s
          port: (( grab instance_groups.metricsforwarder.jobs.metricsforwarder.properties.autoscaler.metricsforwarder.server.port ))

  - name: loggr-syslog-binding-cache
    consumes:
      cloud_controller: { from: cloud_controller, deployment: (( grab meta.cf.deployment_name )) }
    properties:
      aggregate_drains:
      - ca: ((log_cache_syslog_tls_ca.certificate))
        cert: ((syslog_agent_log_cache_tls.certificate))
        key: ((syslog_agent_log_cache_tls.private_key))
        url: syslog-tls://log-cache.service.cf.internal:6067?include-metrics-deprecated=true&ssl-strict-internal=true

variables:
- name: autoscaler_service_broker_username
  type: password
- name: autoscaler_service_broker_password
  type: password
