bosh-variables:
  database:
    host:     (( vault meta.vault "/db/autoscaler:hostname" ))
    port:     (( vault meta.vault "/db/autoscaler:port"     ))
    scheme:   (( vault meta.vault "/db/autoscaler:scheme"   ))
    name:     (( vault meta.vault "/db/autoscaler:database" ))
    username: (( vault meta.vault "/db/autoscaler:username" ))
    password: (( vault meta.vault "/db/autoscaler:password" ))
    sslmode:  (( vault meta.vault "/db/autoscaler:sslmode" ))
    tls:
      ca:     (( vault meta.vault "/db/autoscaler:ca"       ))

variables:
  - (( delete "database_password" ))

instance_groups:
  - name: postgres
    jobs:
      - name: postgres
        properties:
          databases:
            roles:
              - name: postgres
                password: (( grab bosh-variables.database.password ))

  - name: scalingengine
    jobs:
      - name: scalingengine
        properties:
          autoscaler:
            policy_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            scalingengine_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            scheduler_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))

  - name: apiserver
    jobs:
      - name: golangapiserver
        properties:
          autoscaler:
            binding_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            policy_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))

  - name: scheduler
    jobs:
      - name: scheduler
        properties:
          autoscaler:
            policy_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            scheduler_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))

  - name: operator
    jobs:
      - name: operator
        properties:
          autoscaler:
            appmetrics_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            lock_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            policy_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            scalingengine_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))

  - name: eventgenerator
    jobs:
      - name: eventgenerator
        properties:
          autoscaler:
            appmetrics_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            lock_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            policy_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))

  - name: metricsforwarder
    jobs:
      - name: metricsforwarder
        properties:
          autoscaler:
            binding_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            policy_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))
            storedprocedure_db:
              roles:
                - name: postgres
                  password: (( grab bosh-variables.database.password ))

