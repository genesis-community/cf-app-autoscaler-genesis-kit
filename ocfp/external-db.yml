bosh-variables:
  database:
    host:     (( vault meta.vault "/db/autoscaler:hostname" ))
    port:     (( vault meta.vault "/db/autoscaler:port"     ))
    scheme:   (( vault meta.vault "/db/autoscaler:scheme"   ))
    name:     (( vault meta.vault "/db/autoscaler:database" ))
    username: (( vault meta.vault "/db/autoscaler:username" ))
    password: (( vault meta.vault "/db/autoscaler:password" ))
    sslmode:  (( vault meta.vault "/db/autoscaler:sslmode"  ))
    tls:
      ca:     (( vault meta.vault "/db/autoscaler:ca"       ))

variables:
  - (( delete "database_password" ))

instance_groups:
  - name: scalingengine
    jobs:
      - name: scalingengine
        properties:
          autoscaler:
            policy_db:
              address: (( grab bosh-variables.database.host ))
              port: (( grab bosh-variables.database.port ))
              db_scheme: (( grab bosh-variables.database.scheme ))
              databases:
                - (( replace ))
                - name: (( grab bosh-variables.database.name ))
                  tag: default
              roles:
                - (( replace ))
                - name: (( grab bosh-variables.database.username ))
                  password: (( grab bosh-variables.database.password ))
                  tag: default
              sslmode: (( grab bosh-variables.database.sslmode ))
              tls:
                ca: (( grab bosh-variables.database.tls.ca ))
                certificate: (( prune ))
                private_key: (( prune ))
            scalingengine_db:
