---
meta:
  ocfp:
    vault:
      config_prefix: (( grab params.ocfp_vault_config_prefix || "config/" ))
      config: (( concat genesis.ocfp_config_mount genesis.ocfp_env ))        

  cf:
    exodus:          (( concat $GENESIS_EXODUS_MOUNT genesis.env "/cf" ))
    deployment_name: (( concat genesis.env "-cf" ))

  as:
    azs:
      - (( concat genesis.env "-z1" ))
      - (( concat genesis.env "-z2" ))
      - (( concat genesis.env "-z3" ))

    network:    (( concat genesis.env ".cf-app-autoscaler.net-autoscaler" ))      
    networks:
      - name: (( grab meta.as.network ))

