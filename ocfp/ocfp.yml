---

meta:
  vm:
    apiserver:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-apiserver" ))
    scalingengine:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-scalingengine" ))
    scheduler:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-scheduler" ))
    operator:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-operator" ))
    eventgenerator:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-eventgenerator" ))
    metricsforwarder:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-metricsforwarder" ))
    database:
      vm_type:   (( concat genesis.env "." genesis.type ".vm-database" ))
      disk_type: (( concat genesis.env "." genesis.type ".disk-database" ))

  ocfp:
    networks:
      - (( replace ))
      - name: (( concat genesis.env "." genesis.type ".net-autoscaler" ))
    azs:
      - (( concat genesis.env "-z1" ))
      - (( concat genesis.env "-z2" ))
      - (( concat genesis.env "-z3" ))

exodus:
  autoscaler_api_domain:     (( concat "autoscaler." params.cf_system_domain ))
  autoscaler_metrics_domain: (( concat "autoscalermetrics." params.cf_system_domain ))
  service_broker_domain:     (( concat "autoscalerservicebroker." params.cf_system_domain ))

instance_groups:
  - name: apiserver
    azs: (( grab meta.ocfp.azs ))
    networks: (( grab meta.ocfp.networks ))
    vm_type: (( grab meta.vm.apiserver.vm_type ))
    stemcell: default
  - name: scalingengine
    azs: (( grab meta.ocfp.azs ))
    networks: (( grab meta.ocfp.networks ))
    vm_type: (( grab meta.vm.scalingengine.vm_type ))
    stemcell: default
  - name: scheduler
    azs: (( grab meta.ocfp.azs ))
    networks: (( grab meta.ocfp.networks ))
    vm_type: (( grab meta.vm.scheduler.vm_type ))
    stemcell: default
  - name: operator
    azs: (( grab meta.ocfp.azs ))
    networks: (( grab meta.ocfp.networks ))
    vm_type: (( grab meta.vm.operator.vm_type ))
    stemcell: default
  - name: eventgenerator
    azs: (( grab meta.ocfp.azs ))
    networks: (( grab meta.ocfp.networks ))
    vm_type: (( grab meta.vm.eventgenerator.vm_type ))
    stemcell: default
  - name: metricsforwarder
    azs: (( grab meta.ocfp.azs ))
    networks: (( grab meta.ocfp.networks ))
    vm_type: (( grab meta.vm.metricsforwarder.vm_type ))
    stemcell: default
