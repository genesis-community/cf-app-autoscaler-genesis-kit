---
# PVE-specific OCFP overlay for the App Autoscaler. Loaded by hooks/blueprint.pm
# only when iaas == pve.
#
# 1. Dotted OCFP network names (<env>.autoscaler.net-autoscaler) mangle BOSH-DNS
#    long-form link addresses, breaking the inter-component links between the 7
#    autoscaler jobs (apiserver/scalingengine/eventgenerator/operator/scheduler/
#    metricsforwarder + postgres). Resolve links to IPs instead.
- type: replace
  path: /features?
  value:
    use_dns_addresses: false
    use_short_dns_addresses: false
    use_link_dns_names: false

# 2. The shared PVE bridge has no cross-director IPAM, so we pin every instance
#    group to a single AZ instead of spreading dynamic IPs across all three
#    ocfp subnets. The zone comes from params.pve_az (default z2, which is
#    ocfp-1) so an env whose CF already fills that band can point the whole
#    deployment at the subnet that still has seven free addresses, paired with
#    bosh-configs.cloud.networks.autoscaler.allocation.vms_per_subnet.
#    go-patch (not a meta array override) so the single-AZ list reliably
#    replaces the multi-AZ default.
- type: replace
  path: /instance_groups/name=apiserver/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
- type: replace
  path: /instance_groups/name=scalingengine/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
- type: replace
  path: /instance_groups/name=scheduler/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
- type: replace
  path: /instance_groups/name=operator/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
- type: replace
  path: /instance_groups/name=eventgenerator/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
- type: replace
  path: /instance_groups/name=metricsforwarder/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
- type: replace
  path: /instance_groups/name=postgres/azs
  value: [(( concat genesis.env "-" params.pve_az ))]
